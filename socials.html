<head>

<meta name="twitter:title" content="BASH — Socials">
<meta name="twitter:description" content="Follow BASH on Discord, TikTok and Instagram.">

<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">

<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-deep:#3a0e5c;
    --purple-glow:rgba(107,33,168,0.55);
    --line:#2a2430;
    --menu-bg:#22072f;
    --menu-bg-2:#340c47;
    --menu-text:#e9f7f9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;height:100dvh;min-height:320px;
    background:
      radial-gradient(ellipse 70% 60% at 78% 30%, rgba(107,33,168,0.16), transparent 60%),
      radial-gradient(ellipse 90% 70% at 10% 90%, rgba(58,14,92,0.22), transparent 65%),
      var(--bg);
  }

  .menu-btn{
    position:absolute;top:clamp(18px,4vw,34px);left:clamp(18px,4vw,34px);
    z-index:20;display:flex;flex-direction:column;justify-content:center;gap:6px;
    width:30px;padding:12px 4px;background:none;border:none;cursor:pointer;
  }
  .menu-btn span{
    display:block;height:3px;width:100%;border-radius:2px;
    background:var(--ink);opacity:.85;
    transition:transform .25s ease, opacity .2s ease, background .2s ease;
  }
  .menu-btn:hover span{opacity:1;background:var(--purple);}
  .menu-btn:focus-visible{outline:2px solid var(--purple);outline-offset:4px;}
  .menu-btn.is-open span:nth-child(1){ transform:translateY(9px) rotate(45deg); }
  .menu-btn.is-open span:nth-child(2){ opacity:0; }
  .menu-btn.is-open span:nth-child(3){ transform:translateY(-9px) rotate(-45deg); }

  .wordmark-glow{
    position:absolute;left:clamp(300px,34vw,460px);top:clamp(180px,30vh,360px);
    width:clamp(700px,80vw,1300px);height:clamp(700px,80vw,1300px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at center,
      rgba(139,63,209,0.65), rgba(139,63,209,0.38) 32%, rgba(107,33,168,0.16) 55%, transparent 72%);
    z-index:2;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .wordmark-glow{
    opacity:0;
  }

  .wordmark{
    position:absolute;left:clamp(16px,2vw,40px);top:clamp(30px,6vh,64px);
    width:clamp(460px,62vw,900px);
    z-index:3;
    user-select:none;
    transition:opacity .25s ease;
  }
  .wordmark img{
    width:100%;height:auto;display:block;
  }
  .stage.menu-open .wordmark{
    opacity:0;
    pointer-events:none;
  }

  .menu-backdrop{
    position:fixed;inset:0;z-index:9;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .menu-backdrop{
    opacity:1;pointer-events:auto;
  }

  .side-menu{
    position:fixed;top:0;left:0;bottom:0;
    width:min(100vw,1600px);
    z-index:10;
    overflow:hidden;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  .stage.menu-open .side-menu{ transform:translateX(0); }
  .side-menu-bg{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:fill;
    pointer-events:none;
    z-index:0;
  }
  .side-menu-content{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:clamp(30px,6vh,60px) clamp(24px,6vw,56px);
    overflow-y:auto;
  }

  .menu-wordmark{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(5rem,13vw,10rem);
    line-height:.85;
    color:#ffffff;
    text-decoration:none;
    margin:0 0 clamp(60px,12vh,130px);
    transform:rotate(-3deg) translateY(clamp(-60px,-6vh,-30px));
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 22px rgba(255,255,255,.3));
    transition:filter .18s ease, color .18s ease;
  }
  .menu-wordmark:hover, .menu-wordmark:focus-visible{
    color:#e9d6ff;
    filter:drop-shadow(0 0 30px rgba(255,255,255,.5));
  }

  .menu-links{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);
  }
  .menu-links a{
    font-family:"Permanent Marker",cursive;
    font-size:clamp(3.4rem,9vw,7rem);
    color:var(--menu-text);
    text-decoration:none;
    display:inline-block;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
    transition:color .15s ease, transform .15s ease;
  }
  .menu-links li:nth-child(1) a{ transform:rotate(-2deg); }
  .menu-links li:nth-child(2) a{ transform:rotate(1.5deg); }
  .menu-links a:hover, .menu-links a:focus-visible{
    color:#c98bff;
    transform:scale(1.05) rotate(0deg);
  }

  .floor-glow{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(180deg, transparent, rgba(107,33,168,0.10));
    z-index:1;pointer-events:none;
  }

  .signature{
    position:absolute;bottom:clamp(14px,2.4vh,24px);left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(.8rem,1.6vw,1rem);
    color:rgba(244,241,236,.45);
    letter-spacing:.04em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
  }

  .social-buttons{
    position:absolute;right:clamp(4%,7vw,120px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    display:flex;flex-direction:column;
    gap:clamp(20px,3vh,32px);
    width:clamp(320px,32vw,460px);
  }
  .social-btn{
    display:flex;align-items:center;gap:clamp(16px,2vw,24px);
    padding:clamp(20px,2.6vw,30px) clamp(24px,3vw,34px);
    border-radius:16px;
    background:linear-gradient(155deg, var(--menu-bg-2), var(--menu-bg) 75%);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 45px -20px rgba(0,0,0,.6);
    text-decoration:none;
    color:var(--ink);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .social-btn:hover, .social-btn:focus-visible{
    transform:translateX(-6px) scale(1.02);
    border-color:var(--purple);
    box-shadow:0 24px 50px -18px var(--purple-glow);
  }
  .social-btn svg{
    width:clamp(30px,3.4vw,42px);height:clamp(30px,3.4vw,42px);
    flex-shrink:0;color:var(--ink);
  }
  .social-btn span{
    font-size:clamp(1.4rem,2.2vw,2rem);
    font-weight:600;
  }

  @media (max-width: 720px){
    .wordmark{
      left:-16px;top:32px;width:min(78vw,340px);
    }
    .side-menu{
      width:min(82vw,420px);
    }
    .side-menu-content{
      padding:100px 26px 40px;
    }
    .menu-wordmark{ font-size:clamp(3.4rem,16vw,5rem); margin-bottom:64px; }
    .menu-links a{ font-size:clamp(2.4rem,13vw,3.8rem); }
    .social-buttons{
      right:50%;transform:translate(50%,-50%);
      width:min(84vw,360px);
      top:62%;
    }
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }
</style>
</head>

      <a class="menu-wordmark" href="index.html">BASH</a>

<script>
const stage = document.querySelector(".stage");
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const backdrop = document.getElementById("menuBackdrop");

function setMenu(open){
  stage.classList.toggle("menu-open", open);
  menuBtn.classList.toggle("is-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sideMenu.setAttribute("aria-hidden", String(!open));
}

menuBtn.addEventListener("click", () => {
  setMenu(!stage.classList.contains("menu-open"));
});
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setMenu(false);
});
</script>
</body>
