<script>
(function(){
  function setVH(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty("--vh", (h * 0.01) + "px");
  }
  setVH();
  window.addEventListener("resize", setVH);
  window.addEventListener("orientationchange", setVH);
  window.addEventListener("pageshow", setVH);
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", setVH);
  }
})();
</script>
<title>BASH — Page not found</title>

<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-glow:rgba(107,33,168,0.55);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;height:100dvh;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
    opacity:0;
    transition:opacity .35s ease;
  }
  body.page-loaded{
    opacity:1;
  }
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);height:100dvh;min-height:320px;
    background:
      radial-gradient(ellipse 60% 50% at 50% 32%, rgba(107,33,168,0.14), transparent 62%),
      var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:24px;
  }
  .wordmark-link{
    position:absolute;top:calc(clamp(18px,4vw,34px) + env(safe-area-inset-top,0px));left:calc(clamp(18px,4vw,34px) + env(safe-area-inset-left,0px));
    font-family:"Permanent Marker",cursive;
    font-size:clamp(1.6rem,3vw,2.2rem);
    color:var(--ink);
    text-decoration:none;
    opacity:.8;
    transition:opacity .18s ease, transform .18s ease;
  }
  .wordmark-link:hover{ opacity:1; transform:translateY(-2px); }

  .code{
    font-family:"Permanent Marker",cursive;
    font-size:clamp(5rem,16vw,10rem);
    line-height:.9;
    color:#ffffff;
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 30px rgba(139,63,209,.45));
    margin:0;
    transform:rotate(-2deg);
  }
  .msg{
    font-family:"Permanent Marker",cursive;
    font-size:clamp(1.1rem,2.4vw,1.6rem);
    color:#d8cdeb;
    margin:10px 0 30px;
    max-width:32ch;
  }

  .character{
    height:min(var(--vh, 1vh) * 42,340px);
    margin-bottom:20px;
    filter:drop-shadow(0 20px 30px rgba(0,0,0,.6)) drop-shadow(0 0 24px rgba(107,33,168,.28));
    animation:characterFloat 4.5s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
  }
  @keyframes characterFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-14px); }
  }

  .home-btn{
    display:inline-block;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(1.1rem,2vw,1.4rem);
    color:var(--ink);
    text-decoration:none;
    padding:14px 30px;
    border:2px solid rgba(255,255,255,.25);
    border-radius:999px;
    background:rgba(139,63,209,.12);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .home-btn:hover, .home-btn:focus-visible{
    transform:translateY(-2px) scale(1.03);
    border-color:var(--purple);
    background:rgba(139,63,209,.22);
  }

  .signature{
    position:absolute;bottom:calc(clamp(14px,2.4vh,24px) + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%);
    font-family:"Permanent Marker",cursive;
    font-size:clamp(.8rem,1.6vw,1rem);
    color:rgba(244,241,236,.45);
    letter-spacing:.04em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
  }

  @media (max-width: 520px){
    .character{ height:min(var(--vh, 1vh) * 32,240px); }
  }
  @media (prefers-reduced-motion: reduce){
    .character{ animation:none; }
    *{ transition-duration:.001ms !important; }
  }
</style>

<body>
<div class="stage">
  <a class="wordmark-link" href="/">BASH</a>

  <img class="character" src="/assets/character.webp" alt="">
  <h1 class="code">404</h1>
  <p class="msg">Yeah, this page doesn't exist. Probably my fault, not yours.</p>
  <a class="home-btn" href="/">Back home</a>

  <div class="signature">BASH &middot; 2024&ndash;2026</div>
</div>
<script>
(function(){
  function reveal(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.body.classList.add("page-loaded");
      });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", reveal);
  } else {
    reveal();
  }

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.addEventListener("click", function(e){
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest("a");
    if (!a || a.hasAttribute("download") || a.target === "_blank") return;
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) === "#") return;
    var url;
    try { url = new URL(href, location.href); } catch(err) { return; }
    if (url.origin !== location.origin) return;
    if (url.href === location.href) return;
    e.preventDefault();
    document.body.classList.remove("page-loaded");
    setTimeout(function(){ location.href = url.href; }, reduced ? 0 : 320);
  });
})();
</script>
