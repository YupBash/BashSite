<script>
(function(){
  function setVH(){
    document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
  }
  setVH();
  window.addEventListener("resize", setVH);
  window.addEventListener("orientationchange", setVH);
})();
</script>

<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-deep:#3a0e5c;
    --purple-glow:rgba(107,33,168,0.55);
    --line:#2a2430;
    --menu-bg:#22072f;
    --menu-bg-2:#340c47;
    --menu-text:#e9f7f9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);min-height:320px;
    background:
      radial-gradient(ellipse 70% 60% at 78% 30%, rgba(107,33,168,0.08), transparent 60%),
      radial-gradient(ellipse 90% 70% at 10% 90%, rgba(58,14,92,0.11), transparent 65%),
      var(--bg);
  }

  .menu-btn{
    position:absolute;top:clamp(18px,4vw,34px);left:clamp(18px,4vw,34px);
    z-index:20;display:flex;flex-direction:column;justify-content:center;gap:6px;
    width:30px;padding:12px 4px;background:none;border:none;cursor:pointer;
  }
  .menu-btn span{
    display:block;height:3px;width:100%;border-radius:2px;
    background:var(--ink);opacity:.85;
    transition:transform .25s ease, opacity .2s ease, background .2s ease;
  }
  .menu-btn:hover span{opacity:1;background:var(--purple);}
  .menu-btn:focus-visible{outline:2px solid var(--purple);outline-offset:4px;}
  .menu-btn.is-open span:nth-child(1){ transform:translateY(9px) rotate(45deg); }
  .menu-btn.is-open span:nth-child(2){ opacity:0; }
  .menu-btn.is-open span:nth-child(3){ transform:translateY(-9px) rotate(-45deg); }

  .top-socials{
    position:absolute;top:clamp(18px,4vw,34px);right:clamp(18px,4vw,34px);
    z-index:20;display:flex;align-items:center;gap:clamp(14px,2vw,22px);
    transition:opacity .25s ease;
  }
  .top-socials a{
    color:var(--ink);opacity:.8;display:flex;
    transition:opacity .18s ease, color .18s ease, transform .18s ease;
  }
  .top-socials a:hover, .top-socials a:focus-visible{
    opacity:1;color:var(--purple);transform:translateY(-2px);
  }
  .top-socials svg{width:clamp(18px,2.2vw,24px);height:clamp(18px,2.2vw,24px);display:block;}
  .stage.menu-open .top-socials{
    opacity:0;pointer-events:none;
  }

  .wordmark-glow{
    position:absolute;left:clamp(300px,34vw,460px);top:clamp(180px,30vh,360px);
    width:clamp(700px,80vw,1300px);height:clamp(700px,80vw,1300px);
    transform:translate(-50%,-50%);
    background:radial-gradient(circle at center,
      rgba(139,63,209,0.35), rgba(139,63,209,0.2) 32%, rgba(107,33,168,0.08) 55%, transparent 72%);
    z-index:2;
    pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .wordmark-glow{
    opacity:0;
  }

  .wordmark{
    position:absolute;left:clamp(16px,2vw,40px);top:clamp(30px,6vh,64px);
    width:clamp(460px,62vw,900px);
    z-index:3;
    user-select:none;
    transition:opacity .25s ease;
  }
  .wordmark img{
    width:100%;height:auto;display:block;
  }
  .stage.menu-open .wordmark{
    opacity:0;
    pointer-events:none;
  }

  .menu-backdrop{
    position:fixed;top:0;left:0;right:0;
    height:calc(var(--vh, 1vh) * 100);z-index:9;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .menu-backdrop{
    opacity:1;pointer-events:auto;
  }

  .side-menu{
    position:fixed;top:0;left:0;
    height:calc(var(--vh, 1vh) * 100);
    width:100vw;
    z-index:10;
    overflow:hidden;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  .stage.menu-open .side-menu{ transform:translateX(0); }
  .side-menu-bg{
    position:absolute;inset:0;
    width:236%;height:100%;
    object-fit:fill;
    pointer-events:none;
    z-index:0;
  }
  .side-menu-content{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:clamp(30px,6vh,60px) clamp(24px,7vw,90px);
  }

  .menu-wordmark{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(5rem,15vw,13rem);
    line-height:.85;
    color:#ffffff;
    text-decoration:none;
    margin:0 0 clamp(60px,12vh,130px);
    transform:rotate(-3deg) translateY(clamp(-60px,-6vh,-30px));
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 22px rgba(255,255,255,.3));
    transition:filter .18s ease, color .18s ease;
  }
  .menu-wordmark:hover, .menu-wordmark:focus-visible{
    color:#e9d6ff;
    filter:drop-shadow(0 0 30px rgba(255,255,255,.5));
  }

  .menu-links{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);
  }
  .menu-links a{
    font-family:"Permanent Marker",cursive;
    font-size:clamp(3.4rem,10.5vw,9rem);
    color:var(--menu-text);
    text-decoration:none;
    display:inline-block;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
    transition:color .15s ease, transform .15s ease;
  }
  .menu-links li:nth-child(1) a{ transform:rotate(-2deg); }
  .menu-links li:nth-child(2) a{ transform:rotate(1.5deg); }
  .menu-links li a:hover, .menu-links li a:focus-visible{
    color:#c98bff;
    transform:scale(1.05) rotate(0deg);
  }

  .character{
    position:absolute;right:clamp(0%,4vw,5%);bottom:0;
    height:min(var(--vh, 1vh) * 100,1000px);
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.65)) drop-shadow(0 0 28px rgba(107,33,168,0.3));
    z-index:11;
    transition:opacity .25s ease;
  }
  .character img{height:100%;width:auto;display:block;}
  .stage.menu-open .character{
    opacity:.4;
  }

  .floor-glow{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(180deg, transparent, rgba(107,33,168,0.05));
    z-index:1;pointer-events:none;
  }

  .signature{
    position:absolute;bottom:clamp(14px,2.4vh,24px);left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(.8rem,1.6vw,1rem);
    color:rgba(244,241,236,.45);
    letter-spacing:.04em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
  }
  .stage.menu-open .signature{
    z-index:11;
  }

  @media (max-width: 720px){
    .stage{
      background:var(--bg);
    }
    .wordmark{
      left:12px;top:32px;width:min(78vw,340px);
    }
    .character{
      right:0%;bottom:0;
      height:min(var(--vh, 1vh) * 82,750px);
      filter:drop-shadow(0 30px 40px rgba(0,0,0,.65));
      z-index:2;
    }
    .wordmark-glow{
      display:none;
    }
    .floor-glow{
      display:none;
    }
    .side-menu{
      width:100vw;
    }
    .side-menu-bg{
      width:100%;
    }
    .side-menu-content{
      padding:clamp(56px,var(--vh, 1vh) * 12,100px) 26px clamp(24px,var(--vh, 1vh) * 6,40px);
      overflow-y:auto;
    }
    .menu-wordmark{ font-size:clamp(2.4rem,var(--vh, 1vh) * 9,5rem); margin-bottom:clamp(24px,var(--vh, 1vh) * 6,64px); }
    .menu-links a{ font-size:clamp(1.8rem,var(--vh, 1vh) * 7,3.8rem); }
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }
</style>
</head>

<script>
const stage = document.querySelector(".stage");
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const backdrop = document.getElementById("menuBackdrop");

function setMenu(open){
  stage.classList.toggle("menu-open", open);
  menuBtn.classList.toggle("is-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sideMenu.setAttribute("aria-hidden", String(!open));
}

menuBtn.addEventListener("click", () => {
  setMenu(!stage.classList.contains("menu-open"));
});
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setMenu(false);
});
</script>
