<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-deep:#3a0e5c;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;height:100dvh;}
  body{
    background:var(--bg);

    opacity:0;
    transition:opacity .35s ease;
  }
  body.page-loaded{
    opacity:1;
  }
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);height:100dvh;min-height:320px;
    background:
      radial-gradient(ellipse 70% 60% at 78% 30%, rgba(107,33,168,0.08), rgba(107,33,168,0.03) 35%, transparent 80%),
      radial-gradient(ellipse 90% 70% at 10% 90%, rgba(58,14,92,0.11), rgba(58,14,92,0.04) 35%, transparent 85%),
      var(--bg);
  }

  .menu-btn{
    position:absolute;top:calc(max(18px,4vw) + env(safe-area-inset-top,0px));left:calc(max(18px,4vw) + env(safe-area-inset-left,0px));
    z-index:20;display:flex;flex-direction:column;justify-content:center;gap:max(5px,0.45vw);
    width:max(24px,2.3vw);padding:max(10px,0.9vw) max(3px,0.35vw);background:none;border:none;cursor:pointer;
  }
  .menu-btn span{
    display:block;height:max(2.5px,0.2vw);width:100%;border-radius:2px;
    background:var(--ink);opacity:.85;
    transition:transform .25s ease, opacity .2s ease, background .2s ease;
  }
  .menu-btn:hover span{opacity:1;background:var(--purple);}
  .menu-btn:focus-visible{outline:2px solid var(--purple);outline-offset:4px;}
  .menu-btn.intro-pulse{border-radius:8px;animation:menuPulse 1.4s ease-out 3;}
  @keyframes menuPulse{
    0%{ box-shadow:0 0 0 0 rgba(107,33,168,.55); }
    70%{ box-shadow:0 0 0 14px rgba(107,33,168,0); }
    100%{ box-shadow:0 0 0 0 rgba(107,33,168,0); }
  }
  .menu-btn.is-open span:nth-child(1){ transform:translateY(calc(max(5px,0.45vw) + max(2.5px,0.2vw))) rotate(45deg); }
  .menu-btn.is-open span:nth-child(2){ opacity:0; }
  .menu-btn.is-open span:nth-child(3){ transform:translateY(calc(-1 * (max(5px,0.45vw) + max(2.5px,0.2vw)))) rotate(-45deg); }

  .top-socials{
    position:absolute;top:calc(max(18px,4vw) + env(safe-area-inset-top,0px));right:calc(max(18px,4vw) + env(safe-area-inset-right,0px));

  .top-socials a{
    color:var(--ink);opacity:.8;display:flex;

  .stage.menu-open .top-socials{
    opacity:0;pointer-events:none;
  }

  .wordmark-tag{
    position:absolute;left:clamp(30px,6vw,90px);top:50%;

    transition:color .15s ease, transform .15s ease, filter .18s ease;

  .character{

  }
  .character img{height:100%;width:auto;display:block;}
  @keyframes characterFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-18px); }
  }
  @media (prefers-reduced-motion: reduce){
    .character{ animation:none; }
  }
  .character.poke img{
    animation:characterPoke .6s ease;
  }
  @keyframes characterPoke{
    0%, 100%{ transform:none; }
    25%{ transform:rotate(-3deg) scale(1.04); }
    50%{ transform:rotate(2deg) scale(1.02); }
    75%{ transform:rotate(-1deg) scale(1.01); }
  }
  .character-bubble{
    position:absolute;top:0%;right:0%;
    transform:translateY(-6px);
    background:#1a0f24;
    color:var(--ink);
    border:1px solid rgba(255,255,255,.15);
    padding:8px 14px;
    border-radius:14px;
    font-family:"Inter",system-ui,sans-serif;
    font-size:.85rem;
    white-space:nowrap;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:12;
  }
  .character-bubble.show{
    opacity:1;
    transform:translateY(0);
  }
  .character-bubble::after{
    content:"";
    position:absolute;top:100%;right:20px;
    border:6px solid transparent;
    border-top-color:#1a0f24;
  }
  @media (min-width: 721px){
    .character-bubble{
      top:22%;right:calc(100% - 20px);
      transform:translateX(4px);
    }
    .character-bubble.show{
      transform:translateX(0);
    }
    .character-bubble::after{
      top:20px;right:auto;left:100%;
      border-top-color:transparent;
      border-left-color:#1a0f24;
    }
  }
  .stage.menu-open .character{
    opacity:.4;
  }

  .floor-glow{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(180deg, transparent, rgba(107,33,168,0.05));
    z-index:1;pointer-events:none;
  }

  .signature{
    position:absolute;bottom:calc(max(14px,2.4vh) + env(safe-area-inset-bottom,0px));left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-family:"Permanent Marker",cursive;
    font-size:max(.68rem,1.15vw);
    color:rgba(244,241,236,.45);
    letter-spacing:.04em;
    white-space:nowrap;
    pointer-events:none;

  }
  .stage.menu-open .signature{
    z-index:11;

  @media (max-width: 720px){
    .stage{
      background:var(--bg);
    }
    .character{
      right:0%;bottom:0;
      height:min(var(--vh, 1vh) * 84,750px);
      filter:drop-shadow(0 30px 40px rgba(0,0,0,.65));
      z-index:2;
    }
    .wordmark-tag{
      left:14px;
    }
    .wordmark-tag-text{
      font-size:clamp(2.2rem,10vw,4rem);
    }
    .floor-glow{
      display:none;
    }
    .side-menu{
      width:100vw;
    }
    .side-menu-bg{
      width:100%;
    }
    .side-menu-content{
      padding:clamp(56px,var(--vh, 1vh) * 12,100px) 26px clamp(24px,var(--vh, 1vh) * 6,40px);
      overflow-y:auto;
    }
    .menu-wordmark{ font-size:clamp(2.4rem,var(--vh, 1vh) * 9,5rem); margin-bottom:clamp(24px,var(--vh, 1vh) * 6,64px); }
    .menu-links a{ font-size:clamp(1.8rem,var(--vh, 1vh) * 7,3.8rem); }
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }
</style>

<script>
const stage = document.querySelector(".stage");
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const backdrop = document.getElementById("menuBackdrop");

(function(){
  var seen = true;
  try { seen = localStorage.getItem("bashMenuIntroSeen"); } catch(e){}
  if (!seen) {
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function markSeen(){ try { localStorage.setItem("bashMenuIntroSeen", "1"); } catch(e){} }
    if (reduced) {
      markSeen();
    } else {
      menuBtn.classList.add("intro-pulse");
      var stop = function(){
        menuBtn.classList.remove("intro-pulse");
        markSeen();
      };
      menuBtn.addEventListener("click", stop, { once: true });
      setTimeout(stop, 4300);
    }
  }
})();

function setMenu(open){
  stage.classList.toggle("menu-open", open);
  menuBtn.classList.toggle("is-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sideMenu.setAttribute("aria-hidden", String(!open));
}

menuBtn.addEventListener("click", () => {
  setMenu(!stage.classList.contains("menu-open"));
});
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setMenu(false);
});
</script>
<script>
(function(){
  function reveal(){
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        document.body.classList.add("page-loaded");
      });
    });
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", reveal);
  } else {
    reveal();
  }

  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.addEventListener("click", function(e){
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    var a = e.target.closest("a");
    if (!a || a.hasAttribute("download") || a.target === "_blank") return;
    var href = a.getAttribute("href");
    if (!href || href.charAt(0) === "#") return;
    var url;
    try { url = new URL(href, location.href); } catch(err) { return; }
    if (url.origin !== location.origin) return;
    if (url.href === location.href) return;
    e.preventDefault();
    document.body.classList.remove("page-loaded");
    setTimeout(function(){ location.href = url.href; }, reduced ? 0 : 320);
  });
})();
</script>

<script>
(function(){
  var char = document.querySelector(".character");
  if (!char) return;
  var charImg = char.querySelector("img");
  var messages = ["Stop that.", "Bro, stop.", "Alright, Don't do that.", "Hey!"];
  var clicks = [];
  var busy = false;

  var sampleCanvas = null, sampleCtx = null;
  function buildSampler(){
    if (!charImg.naturalWidth) return;
    sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = charImg.naturalWidth;
    sampleCanvas.height = charImg.naturalHeight;
    sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    sampleCtx.drawImage(charImg, 0, 0);
  }
  if (charImg.complete && charImg.naturalWidth) buildSampler();
  else charImg.addEventListener("load", buildSampler, { once: true });

  function isOnCharacter(clientX, clientY){
    if (!sampleCtx) return true;
    var rect = charImg.getBoundingClientRect();
    var xf = (clientX - rect.left) / rect.width;
    var yf = (clientY - rect.top) / rect.height;
    if (xf < 0 || xf > 1 || yf < 0 || yf > 1) return false;
    var px = Math.min(sampleCanvas.width - 1, Math.max(0, Math.floor(xf * sampleCanvas.width)));
    var py = Math.min(sampleCanvas.height - 1, Math.max(0, Math.floor(yf * sampleCanvas.height)));
    return sampleCtx.getImageData(px, py, 1, 1).data[3] > 10;
  }

  char.addEventListener("click", function(e){
    if (!isOnCharacter(e.clientX, e.clientY)) return;
    var now = Date.now();
    clicks.push(now);
    clicks = clicks.filter(function(t){ return now - t < 2500; });
    if (clicks.length < 5 || busy) return;
    busy = true;
    clicks = [];
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduced) {
      char.classList.add("poke");
      setTimeout(function(){ char.classList.remove("poke"); }, 600);
    }
    var bubble = document.createElement("div");
    bubble.className = "character-bubble";
    bubble.textContent = messages[Math.floor(Math.random() * messages.length)];
    char.appendChild(bubble);
    requestAnimationFrame(function(){ bubble.classList.add("show"); });
    setTimeout(function(){
      bubble.classList.remove("show");
      setTimeout(function(){ bubble.remove(); busy = false; }, 300);
    }, 1600);
  });
})();
</script>
</body>
</html>
