  :root{

    --menu-bg:#22072f;
    --menu-bg-2:#340c47;
    --menu-text:#e9f7f9;

  *{box-sizing:border-box;}
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);height:100dvh;min-height:320px;
    background:
      radial-gradient(ellipse 70% 60% at 78% 30%, rgba(107,33,168,0.08), rgba(107,33,168,0.03) 35%, transparent 80%),
      radial-gradient(ellipse 90% 70% at 10% 90%, rgba(58,14,92,0.11), rgba(58,14,92,0.04) 35%, transparent 85%),
      var(--bg);
  }

  .wordmark-tag{
    position:absolute;left:clamp(30px,6vw,90px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    user-select:none;
    animation:tagFloat 4.5s ease-in-out infinite;
    transition:opacity .25s ease;
  }
  @keyframes tagFloat{
    0%, 100%{ transform:translateY(-50%); }
    50%{ transform:translateY(calc(-50% - 18px)); }
  }
  .stage.menu-open .wordmark-tag{
    opacity:0;
    pointer-events:none;
  }
  .wordmark-tag-bar{
    position:relative;
  }
  .wordmark-tag-text{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:max(3.6rem,11vw);
    color:rgba(120,95,155,.32);
    -webkit-text-stroke:2px rgba(190,150,225,.55);
    text-stroke:2px rgba(190,150,225,.55);
    text-shadow:0 0 4px rgba(215,185,240,.65), 0 0 10px rgba(170,100,225,.5), 0 0 20px rgba(139,63,209,.35);
    filter:blur(1.2px);
    letter-spacing:.03em;
    white-space:nowrap;
  }

  .character{
    position:absolute;right:clamp(0%,4vw,5%);bottom:0;
    height:calc(var(--vh, 1vh) * 106);
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.65)) drop-shadow(0 0 28px rgba(107,33,168,0.3));
    z-index:11;
    transition:opacity .25s ease;
    animation:characterFloat 4.5s ease-in-out infinite;
    cursor:pointer;
  }
  .character img{height:100%;width:auto;display:block;}
  @keyframes characterFloat{
    0%, 100%{ transform:translateY(0); }
    50%{ transform:translateY(-18px); }
  }
  @media (prefers-reduced-motion: reduce){
    .character{ animation:none; }
  }
  .character.poke img{
    animation:characterPoke .6s ease;
  }
  @keyframes characterPoke{
    0%, 100%{ transform:none; }
    25%{ transform:rotate(-3deg) scale(1.04); }
    50%{ transform:rotate(2deg) scale(1.02); }
    75%{ transform:rotate(-1deg) scale(1.01); }
  }
  .character-bubble{
    position:absolute;top:0%;right:0%;
    transform:translateY(-6px);
    background:#1a0f24;
    color:var(--ink);
    border:1px solid rgba(255,255,255,.15);
    padding:8px 14px;
    border-radius:14px;
    font-family:"Chakra Petch",system-ui,sans-serif;
    font-size:.85rem;
    white-space:nowrap;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    pointer-events:none;
    z-index:12;
  }
  .character-bubble.show{
    opacity:1;
    transform:translateY(0);
  }
  .character-bubble::after{
    content:"";
    position:absolute;top:100%;right:20px;
    border:6px solid transparent;
    border-top-color:#1a0f24;
  }
  @media (min-width: 721px){
    .character-bubble{
      top:22%;right:calc(100% - 20px);
      transform:translateX(4px);
    }
    .character-bubble.show{
      transform:translateX(0);
    }
    .character-bubble::after{
      top:20px;right:auto;left:100%;
      border-top-color:transparent;
      border-left-color:#1a0f24;
    }
  }
  .stage.menu-open .character{
    opacity:.4;
  }

  .floor-glow{
    position:absolute;left:0;right:0;bottom:0;height:22%;
    background:linear-gradient(180deg, transparent, rgba(107,33,168,0.05));
    z-index:1;pointer-events:none;
  }

  @media (max-width: 720px){
    .stage{
      background:var(--bg);
    }
    .character{
      right:0%;bottom:0;
      height:min(var(--vh, 1vh) * 84,750px);
      filter:drop-shadow(0 30px 40px rgba(0,0,0,.65));
      z-index:2;
    }
    .wordmark-tag{
      left:16px;top:auto;
      bottom:calc(var(--vh, 1vh) * 13 + env(safe-area-inset-bottom,0px));
      animation:tagFloatMobile 4.5s ease-in-out infinite;
    }
    @keyframes tagFloatMobile{
      0%, 100%{ transform:translateY(0); }
      50%{ transform:translateY(-10px); }
    }
    .wordmark-tag-text{
      font-size:clamp(4.2rem,26vw,7.5rem);
      filter:blur(.6px);
      text-shadow:0 0 4px rgba(215,185,240,.75), 0 0 12px rgba(170,100,225,.6), 0 0 26px rgba(139,63,209,.45), 0 6px 30px rgba(0,0,0,.95);
    }
    .floor-glow{
      display:none;
    }
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }

<script>
(function(){
  var char = document.querySelector(".character");
  if (!char) return;
  var charImg = char.querySelector("img");
  var messages = ["Stop that.", "Bro, stop.", "Alright, Don't do that.", "Hey!"];
  var clicks = [];
  var busy = false;

  var sampleCanvas = null, sampleCtx = null;
  function buildSampler(){
    if (!charImg.naturalWidth) return;
    sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = charImg.naturalWidth;
    sampleCanvas.height = charImg.naturalHeight;
    sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    sampleCtx.drawImage(charImg, 0, 0);
  }
  if (charImg.complete && charImg.naturalWidth) buildSampler();
  else charImg.addEventListener("load", buildSampler, { once: true });

  function isOnCharacter(clientX, clientY){
    if (!sampleCtx) return true;
    var rect = charImg.getBoundingClientRect();
    var xf = (clientX - rect.left) / rect.width;
    var yf = (clientY - rect.top) / rect.height;
    if (xf < 0 || xf > 1 || yf < 0 || yf > 1) return false;
    var px = Math.min(sampleCanvas.width - 1, Math.max(0, Math.floor(xf * sampleCanvas.width)));
    var py = Math.min(sampleCanvas.height - 1, Math.max(0, Math.floor(yf * sampleCanvas.height)));
    return sampleCtx.getImageData(px, py, 1, 1).data[3] > 10;
  }

  char.addEventListener("click", function(e){
    if (!isOnCharacter(e.clientX, e.clientY)) return;
    var now = Date.now();
    clicks.push(now);
    clicks = clicks.filter(function(t){ return now - t < 2500; });
    if (clicks.length < 5 || busy) return;
    busy = true;
    clicks = [];
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (!reduced) {
      char.classList.add("poke");
      setTimeout(function(){ char.classList.remove("poke"); }, 600);
    }
    var bubble = document.createElement("div");
    bubble.className = "character-bubble";
    bubble.textContent = messages[Math.floor(Math.random() * messages.length)];
    char.appendChild(bubble);
    requestAnimationFrame(function(){ bubble.classList.add("show"); });
    setTimeout(function(){
      bubble.classList.remove("show");
      setTimeout(function(){ bubble.remove(); busy = false; }, 300);
    }, 1600);
  });
})();
</script>
