  function setVH(){
    document.documentElement.style.setProperty("--vh", (window.innerHeight * 0.01) + "px");
  }
  setVH();
  window.addEventListener("resize", setVH);
  window.addEventListener("orientationchange", setVH);
})();
</script>

<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-deep:#3a0e5c;
    --purple-glow:rgba(107,33,168,0.55);
    --line:#2a2430;
    --menu-bg:#22072f;
    --menu-bg-2:#340c47;
    --menu-text:#e9f7f9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
  }
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);min-height:320px;
    background:var(--bg);
    user-select:none;-webkit-user-select:none;
  }

  .menu-btn{
    position:absolute;top:clamp(18px,4vw,34px);left:clamp(18px,4vw,34px);
    z-index:20;display:flex;flex-direction:column;justify-content:center;gap:6px;
    width:30px;padding:12px 4px;background:none;border:none;cursor:pointer;
  }
  .menu-btn span{
    display:block;height:3px;width:100%;border-radius:2px;
    background:var(--ink);opacity:.85;
    transition:transform .25s ease, opacity .2s ease, background .2s ease;
  }
  .menu-btn:hover span{opacity:1;background:var(--purple);}
  .menu-btn:focus-visible{outline:2px solid var(--purple);outline-offset:4px;}
  .menu-btn.is-open span:nth-child(1){ transform:translateY(9px) rotate(45deg); }
  .menu-btn.is-open span:nth-child(2){ opacity:0; }
  .menu-btn.is-open span:nth-child(3){ transform:translateY(-9px) rotate(-45deg); }

  .wordmark-tag{
    position:absolute;left:clamp(30px,6vw,90px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    user-select:none;
    animation:tagFloat 4.5s ease-in-out infinite;
    transition:opacity .25s ease;
  }
  .stage.menu-open .wordmark-tag{
    opacity:0;
    pointer-events:none;
  }
  .wordmark-tag-glow{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    width:clamp(900px,95vw,2450px);height:clamp(900px,95vw,2450px);
    background:radial-gradient(circle at center,
      rgba(139,63,209,0.55), rgba(139,63,209,0.28) 35%, rgba(107,33,168,0.12) 58%, transparent 76%);
    z-index:-1;
    pointer-events:none;
  }
  .wordmark-tag-bar{
    position:relative;
  }
  .wordmark-tag-text{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(3rem,8.5vw,13.6rem);
    color:rgba(120,95,155,.26);
    text-shadow:0 0 16px rgba(90,35,140,.45);
    filter:blur(1.4px);
    letter-spacing:.03em;
    white-space:nowrap;
  }
  @keyframes tagFloat{
    0%, 100%{ transform:translateY(-50%); }
    50%{ transform:translateY(calc(-50% - 18px)); }
  }
  @media (prefers-reduced-motion: reduce){
    .wordmark-tag{ animation:none; }
  }

  .menu-backdrop{
    position:fixed;top:0;left:0;right:0;
    height:calc(var(--vh, 1vh) * 100);z-index:9;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .menu-backdrop{
    opacity:1;pointer-events:auto;
  }

  .side-menu{
    position:fixed;top:0;left:0;
    height:calc(var(--vh, 1vh) * 100);
    width:100vw;
    z-index:10;
    overflow:hidden;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  .stage.menu-open .side-menu{ transform:translateX(0); }
  .side-menu-bg{
    position:absolute;inset:0;
    top:-35.1%;
    width:236%;height:135.1%;
    object-fit:fill;
    pointer-events:none;
    z-index:0;
  }
  .side-menu-content{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:clamp(30px,6vh,60px) clamp(24px,7vw,90px);
  }

  .menu-wordmark{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(3.6rem,10vw,16rem);
    line-height:.85;
    color:#ffffff;
    text-decoration:none;
    margin:0 0 clamp(40px,8vh,112px);
    transform:rotate(-3deg) translateY(clamp(-60px,-6vh,-30px));
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 22px rgba(255,255,255,.3));
    transition:filter .18s ease, color .18s ease, transform .15s ease;
  }
  .menu-wordmark:hover, .menu-wordmark:focus-visible{
    color:#e9d6ff;
    filter:drop-shadow(0 0 30px rgba(255,255,255,.5));
    transform:rotate(0deg) translateY(clamp(-60px,-6vh,-30px)) scale(1.05);
  }

  .menu-links{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);
  }
  .menu-links a{
    font-family:"Permanent Marker",cursive;
    font-size:clamp(2.4rem,7vw,11.2rem);
    color:var(--menu-text);
    text-decoration:none;
    display:inline-block;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
    transition:color .15s ease, transform .15s ease;
  }
  .menu-links li:nth-child(1) a{ transform:rotate(-2deg); }
  .menu-links li:nth-child(2) a{ transform:rotate(1.5deg); }
  .menu-links li a:hover, .menu-links li a:focus-visible{
    color:#c98bff;
    transform:scale(1.05) rotate(0deg);
  }

  .floor-glow{
    display:none;
  }

  .signature{
    position:absolute;bottom:clamp(14px,2.4vh,24px);left:50%;
    transform:translateX(-50%);
    z-index:5;
    font-family:"Permanent Marker",cursive;
    font-size:clamp(.8rem,1.6vw,1rem);
    color:rgba(244,241,236,.45);
    letter-spacing:.04em;
    white-space:nowrap;
    pointer-events:none;
    user-select:none;
  }
  .stage.menu-open .signature{
    z-index:11;
  }

  .social-buttons{
    position:absolute;right:clamp(4%,7vw,180px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    display:flex;flex-direction:column;
    gap:clamp(20px,3vh,42px);
    width:clamp(320px,32vw,819px);
  }
  .social-btn{
    display:flex;align-items:center;gap:clamp(16px,2vw,51px);
    padding:clamp(20px,2.6vw,67px) clamp(24px,3vw,77px);
    border-radius:16px;
    background:linear-gradient(155deg, var(--menu-bg-2), var(--menu-bg) 75%);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 45px -20px rgba(0,0,0,.6);
    text-decoration:none;
    color:var(--ink);
    transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .social-btn:hover, .social-btn:focus-visible{
    transform:translateX(-6px) scale(1.02);
    border-color:var(--purple);
    box-shadow:0 24px 50px -18px var(--purple-glow);
  }
  .social-btn svg{
    width:clamp(30px,3.4vw,87px);height:clamp(30px,3.4vw,87px);
    flex-shrink:0;color:var(--ink);
  }
  .social-btn span{
    font-size:clamp(1.4rem,2.2vw,3.52rem);
    font-weight:600;
  }

  @media (max-width: 720px){
    .wordmark-tag-glow{
      display:none;
    }
    .wordmark-tag{
      left:14px;
    }
    .wordmark-tag-text{
      font-size:clamp(2.2rem,10vw,4rem);
    }
    .side-menu{
      width:100vw;
    }
    .side-menu-bg{
      width:100%;
    }
    .side-menu-content{
      padding:clamp(56px,var(--vh, 1vh) * 12,100px) 26px clamp(24px,var(--vh, 1vh) * 6,40px);
      overflow-y:auto;
    }
    .menu-wordmark{ font-size:clamp(2.4rem,var(--vh, 1vh) * 9,5rem); margin-bottom:clamp(24px,var(--vh, 1vh) * 6,64px); }
    .menu-links a{ font-size:clamp(1.8rem,var(--vh, 1vh) * 7,3.8rem); }
    .social-buttons{
      right:50%;transform:translate(50%,-50%);
      width:min(84vw,360px);
      top:62%;
    }
  }
  @media (prefers-reduced-motion: reduce){ *{transition-duration:.001ms !important;} }
</style>
</head>
<body>

<script>
const stage = document.querySelector(".stage");
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const backdrop = document.getElementById("menuBackdrop");

function setMenu(open){
  stage.classList.toggle("menu-open", open);
  menuBtn.classList.toggle("is-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sideMenu.setAttribute("aria-hidden", String(!open));
}

menuBtn.addEventListener("click", () => {
  setMenu(!stage.classList.contains("menu-open"));
});
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setMenu(false);
});

const sideMenuBg = document.querySelector(".side-menu-bg");
let menuArtCanvas = null, menuArtCtx = null;
function buildMenuArtSampler(){
  menuArtCanvas = document.createElement("canvas");
  menuArtCanvas.width = sideMenuBg.naturalWidth;
  menuArtCanvas.height = sideMenuBg.naturalHeight;
  menuArtCtx = menuArtCanvas.getContext("2d", { willReadFrequently: true });
  menuArtCtx.drawImage(sideMenuBg, 0, 0);
}
if (sideMenuBg.complete && sideMenuBg.naturalWidth) buildMenuArtSampler();
else sideMenuBg.addEventListener("load", buildMenuArtSampler, { once: true });

function isMenuArtOpaqueAt(clientX, clientY){
  if (!menuArtCtx) return true;
  const rect = sideMenuBg.getBoundingClientRect();
  const xf = (clientX - rect.left) / rect.width;
  const yf = (clientY - rect.top) / rect.height;
  if (xf < 0 || xf > 1 || yf < 0 || yf > 1) return false;
  const px = Math.min(menuArtCanvas.width - 1, Math.max(0, Math.floor(xf * menuArtCanvas.width)));
  const py = Math.min(menuArtCanvas.height - 1, Math.max(0, Math.floor(yf * menuArtCanvas.height)));
  return menuArtCtx.getImageData(px, py, 1, 1).data[3] > 10;
}

sideMenu.addEventListener("click", (e) => {
  if (isMenuArtOpaqueAt(e.clientX, e.clientY)) return;
  e.preventDefault();
  e.stopPropagation();
  const prevPE = sideMenu.style.pointerEvents;
  const prevBackdropPE = backdrop.style.pointerEvents;
  sideMenu.style.pointerEvents = "none";
  backdrop.style.pointerEvents = "none";
  const target = document.elementFromPoint(e.clientX, e.clientY);
  sideMenu.style.pointerEvents = prevPE;
  backdrop.style.pointerEvents = prevBackdropPE;
  if (target) target.click();
}, true);
</script>
