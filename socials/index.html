<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Permanent+Marker&display=swap">
<style>
  :root{
    --bg:#08070a;
    --ink:#f4f1ec;
    --purple:#6b21a8;
    --purple-deep:#3a0e5c;
    --purple-glow:rgba(107,33,168,0.55);
    --line:#2a2430;
    --menu-bg:#22072f;
    --menu-bg-2:#340c47;
    --menu-text:#e9f7f9;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;
    overflow:hidden;
    opacity:0;
    transition:opacity .35s ease;
  }
  body.page-loaded{
    opacity:1;
  }
  .stage{
    position:relative;
    width:100%;height:calc(var(--vh, 1vh) * 100);min-height:320px;
    background:var(--bg);
    user-select:none;-webkit-user-select:none;
  }

  .menu-btn{
    position:absolute;top:max(18px,4vw);left:max(18px,4vw);
    z-index:20;display:flex;flex-direction:column;justify-content:center;gap:max(5px,0.45vw);
    width:max(24px,2.3vw);padding:max(10px,0.9vw) max(3px,0.35vw);background:none;border:none;cursor:pointer;
  }
  .menu-btn span{
    display:block;height:max(2.5px,0.2vw);width:100%;border-radius:2px;
    background:var(--ink);opacity:.85;
    transition:transform .25s ease, opacity .2s ease, background .2s ease;
  }
  .menu-btn:hover span{opacity:1;background:var(--purple);}
  .menu-btn:focus-visible{outline:2px solid var(--purple);outline-offset:4px;}
  .menu-btn.is-open span:nth-child(1){ transform:translateY(calc(max(5px,0.45vw) + max(2.5px,0.2vw))) rotate(45deg); }
  .menu-btn.is-open span:nth-child(2){ opacity:0; }
  .menu-btn.is-open span:nth-child(3){ transform:translateY(calc(-1 * (max(5px,0.45vw) + max(2.5px,0.2vw)))) rotate(-45deg); }

  .wordmark-tag{
    position:absolute;left:clamp(30px,6vw,90px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    user-select:none;
    animation:tagFloat 4.5s ease-in-out infinite;
    transition:opacity .25s ease;
  }
  .stage.menu-open .wordmark-tag{
    opacity:0;
    pointer-events:none;
  }
  .wordmark-tag-bar{
    position:relative;
  }
  .wordmark-tag-text{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:max(3.6rem,11vw);
    color:rgba(120,95,155,.32);
    -webkit-text-stroke:2px rgba(190,150,225,.55);
    text-stroke:2px rgba(190,150,225,.55);
    text-shadow:0 0 4px rgba(215,185,240,.65), 0 0 10px rgba(170,100,225,.5), 0 0 20px rgba(139,63,209,.35);
    filter:blur(1.2px);
    letter-spacing:.03em;
    white-space:nowrap;
  }
  @keyframes tagFloat{
    0%, 100%{ transform:translateY(-50%); }
    50%{ transform:translateY(calc(-50% - 18px)); }
  }
  @media (prefers-reduced-motion: reduce){
    .wordmark-tag{ animation:none; }
  }

  .menu-backdrop{
    position:fixed;top:0;left:0;right:0;
    height:calc(var(--vh, 1vh) * 100);z-index:9;
    opacity:0;pointer-events:none;
    transition:opacity .25s ease;
  }
  .stage.menu-open .menu-backdrop{
    opacity:1;pointer-events:auto;
  }

  .side-menu{
    position:fixed;top:0;left:0;
    height:calc(var(--vh, 1vh) * 100);
    width:100vw;
    z-index:10;
    overflow:hidden;
    transform:translateX(-100%);
    transition:transform .35s cubic-bezier(.65,0,.35,1);
  }
  .stage.menu-open .side-menu{ transform:translateX(0); }
  .side-menu-bg{
    position:absolute;inset:0;
    top:-35.1%;
    width:236%;height:135.1%;
    object-fit:fill;
    pointer-events:none;
    z-index:0;
  }
  .side-menu-content{
    position:relative;z-index:1;
    height:100%;
    display:flex;flex-direction:column;
    justify-content:center;
    padding:clamp(30px,6vh,60px) clamp(24px,7vw,90px);
  }

  .menu-wordmark{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:max(3.6rem,10vw);
    line-height:.85;
    color:#ffffff;
    text-decoration:none;
    margin:0 0 max(40px,8vh);
    transform:rotate(-3deg) translateY(clamp(-60px,-6vh,-30px));
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 22px rgba(255,255,255,.3));
    transition:filter .18s ease, color .18s ease, transform .15s ease;
  }
  .menu-wordmark:hover, .menu-wordmark:focus-visible{
    color:#e9d6ff;
    filter:drop-shadow(0 0 30px rgba(255,255,255,.5));
    transform:rotate(0deg) translateY(clamp(-60px,-6vh,-30px)) scale(1.05);
  }

  .menu-links{
    list-style:none;margin:0;padding:0;
    display:flex;flex-direction:column;gap:clamp(16px,3vh,30px);
  }
  .menu-links a{
    font-family:"Permanent Marker",cursive;
    font-size:max(2.4rem,7vw);
    color:var(--menu-text);
    text-decoration:none;
    display:inline-block;
    text-shadow:0 4px 0 rgba(0,0,0,.35);
    transition:color .15s ease, transform .15s ease;
  }
  .menu-links li:nth-child(1) a{ transform:rotate(-2deg); }
  .menu-links li:nth-child(2) a{ transform:rotate(1.5deg); }

const stage = document.querySelector(".stage");
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const backdrop = document.getElementById("menuBackdrop");

function setMenu(open){
  stage.classList.toggle("menu-open", open);
  menuBtn.classList.toggle("is-open", open);
  menuBtn.setAttribute("aria-expanded", String(open));
  menuBtn.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  sideMenu.setAttribute("aria-hidden", String(!open));
}

menuBtn.addEventListener("click", () => {
  setMenu(!stage.classList.contains("menu-open"));
});
backdrop.addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") setMenu(false);
});

const sideMenuBg = document.querySelector(".side-menu-bg");
let menuArtCanvas = null, menuArtCtx = null;
function buildMenuArtSampler(){
  menuArtCanvas = document.createElement("canvas");
  menuArtCanvas.width = sideMenuBg.naturalWidth;
  menuArtCanvas.height = sideMenuBg.naturalHeight;
  menuArtCtx = menuArtCanvas.getContext("2d", { willReadFrequently: true });
  menuArtCtx.drawImage(sideMenuBg, 0, 0);
}
if (sideMenuBg.complete && sideMenuBg.naturalWidth) buildMenuArtSampler();
else sideMenuBg.addEventListener("load", buildMenuArtSampler, { once: true });

function isMenuArtOpaqueAt(clientX, clientY){
  if (!menuArtCtx) return true;
  const rect = sideMenuBg.getBoundingClientRect();
  const xf = (clientX - rect.left) / rect.width;
  const yf = (clientY - rect.top) / rect.height;
  if (xf < 0 || xf > 1 || yf < 0 || yf > 1) return false;
  const px = Math.min(menuArtCanvas.width - 1, Math.max(0, Math.floor(xf * menuArtCanvas.width)));
  const py = Math.min(menuArtCanvas.height - 1, Math.max(0, Math.floor(yf * menuArtCanvas.height)));
  return menuArtCtx.getImageData(px, py, 1, 1).data[3] > 10;
}

sideMenu.addEventListener("click", (e) => {
  if (isMenuArtOpaqueAt(e.clientX, e.clientY)) return;
  e.preventDefault();
  e.stopPropagation();
  const prevPE = sideMenu.style.pointerEvents;
  const prevBackdropPE = backdrop.style.pointerEvents;
  sideMenu.style.pointerEvents = "none";
  backdrop.style.pointerEvents = "none";
  const target = document.elementFromPoint(e.clientX, e.clientY);
  sideMenu.style.pointerEvents = prevPE;
  backdrop.style.pointerEvents = prevBackdropPE;
  if (target) target.click();
}, true);
</script>
