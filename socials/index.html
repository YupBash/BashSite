  .wordmark-tag{

    user-select:none;
    animation:tagFloat 4.5s ease-in-out infinite;
    transition:opacity .25s ease;

    pointer-events:none;
  }
  .wordmark-tag-bar{
    position:relative;
  }

    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:max(3.6rem,11vw);
    color:rgba(120,95,155,.32);
    -webkit-text-stroke:2px rgba(190,150,225,.55);
    text-stroke:2px rgba(190,150,225,.55);
    text-shadow:0 0 4px rgba(215,185,240,.65), 0 0 10px rgba(170,100,225,.5), 0 0 20px rgba(139,63,209,.35);
    filter:blur(1.2px);
    letter-spacing:.03em;
    white-space:nowrap;
  }
  @keyframes tagFloat{
    0%, 100%{ transform:translateY(-50%); }
    50%{ transform:translateY(calc(-50% - 18px)); }
  }
  @media (prefers-reduced-motion: reduce){
    .wordmark-tag{ animation:none; }
  }

  .menu-wordmark{
    display:block;
    font-family:"Permanent Marker",cursive;
    font-size:max(3.6rem,10vw);
    line-height:.85;
    color:#ffffff;
    text-decoration:none;
    margin:0 0 max(40px,8vh);
    transform:rotate(-3deg) translateY(clamp(-60px,-6vh,-30px));
    transform-origin:top;
    text-shadow:0 6px 0 rgba(0,0,0,.4);
    filter:drop-shadow(0 0 22px rgba(255,255,255,.3));
    transition:filter .18s ease, color .18s ease, transform .15s ease;
  }

  .floor-glow{
    display:none;
  }

  .social-buttons{
    position:absolute;right:clamp(4%,7vw,180px);top:50%;
    transform:translateY(-50%);
    z-index:3;
    display:flex;flex-direction:column;
    gap:max(20px,2vh);
    width:max(300px,21vw);
  }
  .social-btn{
    display:flex;align-items:center;gap:max(14px,1.3vw);
    padding:max(16px,1.7vw) max(20px,2vw);
    border-radius:8px;
    background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.10);
    text-decoration:none;
    color:var(--ink);
    transition:transform .18s ease, border-color .18s ease, background .18s ease;
  }
  .social-btn:hover, .social-btn:focus-visible{
    transform:translateX(-6px) scale(1.02);
    border-color:var(--purple);
    background:rgba(107,33,168,.12);
  }
  .social-btn svg{
    width:max(26px,2.2vw);height:max(26px,2.2vw);
    flex-shrink:0;color:var(--ink);
  }
  .social-btn span{
    font-size:max(1.2rem,1.5vw);
    font-weight:600;
  }

  @media (max-width: 720px){
    .menu-wordmark{ font-size:clamp(2.4rem,var(--vh, 1vh) * 9,5rem); margin-bottom:clamp(24px,var(--vh, 1vh) * 6,64px); }
