<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BASH — share image (1200×630)</title>
<!-- Composition rendered by tools/render-assets.py into assets/og-image.jpg. Not part of the site (excluded by _config.yml). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:ital,wdth,wght@1,50..150,100..900&family=Chakra+Petch:ital,wght@1,600&family=Martian+Mono:wdth,wght@75..112.5,300..700&display=swap">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#07050c}
  .og{position:relative;width:1200px;height:630px;overflow:hidden;
    background:radial-gradient(60% 75% at 66% 38%,rgb(43 20 82),rgb(20 10 41) 55%,rgb(7 5 12)),#07050c}
  .og::after{content:"";position:absolute;left:0;right:0;top:72%;height:1px;background:linear-gradient(90deg,transparent,rgba(207,226,255,.35),transparent)}
  .sculpt{position:absolute;right:150px;top:-40px;width:620px;height:620px;object-fit:contain}
  .char{position:absolute;right:40px;bottom:0;height:600px;filter:drop-shadow(0 30px 40px rgba(0,0,0,.65)) drop-shadow(0 0 34px rgba(124,58,237,.35))}
  .copy{position:absolute;left:70px;top:150px}
  .tab{display:inline-block;padding:7px 26px 8px;border:1.5px solid var(--nc-accent);border-radius:4px 14px 4px 14px;background:var(--nc-tabfill);
    font-family:var(--nc-font-display);font-style:italic;font-stretch:130%;font-weight:500;font-size:24px;color:var(--nc-ink)}
  .word{margin:14px 0 0 -6px;font-family:var(--nc-font-display);font-style:italic;font-stretch:150%;font-weight:900;font-size:200px;line-height:.8;letter-spacing:-.02em;
    filter:drop-shadow(0 0 28px rgba(139,92,246,.4)) drop-shadow(0 7px 0 rgba(0,0,0,.55))}
  .tag{margin:26px 0 0;font-family:"Chakra Petch",sans-serif;font-style:italic;font-weight:600;font-size:28px;color:var(--nc-ink)}
  .site{margin:10px 0 0;font:600 15px/1 var(--nc-font-mono);letter-spacing:.2em;text-transform:uppercase;color:var(--nc-hud)}
  .c{position:absolute;width:26px;height:26px;border:0 solid var(--nc-accent);opacity:.8}
  .c.a{left:20px;top:20px;border-top-width:2px;border-left-width:2px}.c.b{right:20px;top:20px;border-top-width:2px;border-right-width:2px}
  .c.d{left:20px;bottom:20px;border-bottom-width:2px;border-left-width:2px}.c.e{right:20px;bottom:20px;border-bottom-width:2px;border-right-width:2px}
</style>
</head>
<body>
<div class="og">
  <img class="sculpt" src="/assets/chrome-fallback.webp" alt="">
  <img class="char" src="/assets/character.webp" alt="">
  <div class="copy">
    <span class="tab">welcome..</span>
    <div class="word chrome-text">BASH</div>
    <p class="tag">I can't get myself out of gambling.</p>
    <p class="site">::yupbash.vip</p>
  </div>
  <span class="c a"></span><span class="c b"></span><span class="c d"></span><span class="c e"></span>
</div>
</body>
</html>
